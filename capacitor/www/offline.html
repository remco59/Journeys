<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Journeys</title>
<style>
  :root {
    color-scheme: light dark;
    --color-paper: #f7f2e6;
    --color-ink: #141a20;
    --color-ink-soft: #2b333b;
    --color-teal: #2e5c58;
    --color-teal-deep: #1f433f;
    --color-cream: #fbf7ee;
    --color-stone: #8c8172;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-paper: #171b1f;
      --color-ink: #ede7d9;
      --color-ink-soft: #b8b0a0;
      --color-teal: #6ea89f;
      --color-teal-deep: #8fc0b7;
      --color-cream: #f7f2e6;
      --color-stone: #a89d8a;
    }
  }
  * {
    box-sizing: border-box;
  }
  html,
  body {
    margin: 0;
    padding: 0;
    height: 100%;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--color-paper);
    color: var(--color-ink);
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    text-align: center;
    padding: 2rem;
  }
  .card {
    max-width: 22rem;
  }
  .mark {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.75rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--color-teal);
    margin: 0 0 1.5rem;
  }
  .icon {
    width: 3rem;
    height: 3rem;
    margin: 0 auto 1.25rem;
    color: var(--color-stone);
  }
  h1 {
    font-size: 1.125rem;
    font-weight: 600;
    margin: 0 0 0.5rem;
  }
  p {
    font-size: 0.9375rem;
    color: var(--color-ink-soft);
    line-height: 1.5;
    margin: 0 0 1.75rem;
  }
  a.retry {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 9999px;
    background: var(--color-teal);
    color: var(--color-cream);
    font-weight: 600;
    font-size: 0.875rem;
    text-decoration: none;
    padding: 0.6rem 1.5rem;
    transition: background 0.15s ease;
  }
  a.retry:hover {
    background: var(--color-teal-deep);
  }
</style>
</head>
<body>
  <div class="card">
    <p class="mark">Journeys</p>
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8.5 8.5a5 5 0 0 1 7 0" />
      <path d="M5.5 5.5a9 9 0 0 1 13 0" />
      <line x1="12" y1="17" x2="12.01" y2="17" />
      <line x1="3" y1="3" x2="21" y2="21" />
    </svg>
    <h1>Can't reach Journeys</h1>
    <p>Check your connection and try again.</p>
    <a class="retry" href="https://journeys.remcoland.nl/">Retry</a>
  </div>
</body>
</html>
